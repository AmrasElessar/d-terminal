# D-Terminal GitHub Pages — minimal Jekyll config.
#
# Bu site'ın amacı YALNIZ statik dokümanlar host etmek:
#   - Privacy policy (listing.md'de MS Store'a verilecek URL)
#   - Landing sayfası (GitHub repo'ya yönlendiren mini sayfa)
#
# Repo'nun ana README'si zaten GitHub'da render edildiği için burada
# tekrarlanmaz. Site root /docs dizini, Pages settings'te seçilir.

title: D-Terminal
description: Agent-aware Windows terminal — GPL-3.0-or-later
url: "https://amraselessar.github.io"
baseurl: "/d-terminal"

# minima en sade Jekyll theme — extra setup'a gerek yok
theme: minima
minima:
  social_links:
    github: AmrasElessar

# Sadece markdown dosyalarını render et; node_modules / src vb. her şey hariç.
include:
  - privacy.md
  - index.md
exclude:
  - "*.docx"
  - architecture-v1.1.md
  - dev-setup.md
  - github-profile-readme.md
  - store/
  - adr/
  - media/

# URL formatı — listing.md'de geçen `/privacy.html` ile uyumlu olsun diye
# basename'i extension ile birlikte permalink yap.
permalink: /:basename:output_ext

# GitHub Pages varsayılan SHA-pinned plugin set
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
