version: 2
# Dependabot — package güncellemelerini otomatik PR'la.
# CVE alarmları gerçek zamanlı; sürüm güncellemeleri haftalık batch.
#
# Strateji:
#   - patch + minor → tek "dependencies" grup PR'ı (auto-merge'e uygun)
#   - major → ayrı "major" grup PR'ı (manuel review + breaking change kontrolü)
#   - sidecar npm de major bloke — node-pty 1→2 gibi kritik bumps için manuel
#   - actions weekly (security patch'leri için aylık çok yavaş)

updates:
  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "deps(npm)"
      include: scope

  # Sidecar (Node) — major bloke; node-pty / pkg breaking changes manuel
  - package-ecosystem: npm
    directory: /sidecar
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, sidecar]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      sidecar-dependencies:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "deps(sidecar)"

  # Rust (Cargo)
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    groups:
      cargo-dependencies:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "deps(cargo)"

  # GitHub Actions — weekly (security patch'ler için aylık çok yavaş)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
