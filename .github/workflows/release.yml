name: Release

on:
  push:
    tags:
      - 'v*'

# softprops/action-gh-release release oluşturmak/upload yapmak için
# GITHUB_TOKEN'in `contents: write` iznine ihtiyaç duyar (yeni org/repo
# default'u read-only).
permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.arch_label }})
    runs-on: windows-latest
    # x64 + ARM64'ü ikisini birden CI'da derler. Updater imzaları içerik-tabanlı
    # olduğundan SHA-256 nondeterminism updater yolunu etkilemez. Maintainer
    # dilerse SHA-256 dokümanı için lokal x64 binary'sini release'e elle
    # yükleyip CI çıktısını ezdirebilir.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            arch_label: arm64
            rust_target: aarch64-pc-windows-msvc
            sidecar_script: bundle:arm64
          - arch: x86_64
            arch_label: x64
            rust_target: x86_64-pc-windows-msvc
            sidecar_script: bundle:x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sidecar install (with dev deps for pkg)
        working-directory: sidecar
        run: npm install

      - name: Sidecar bundle (pkg standalone exe)
        working-directory: sidecar
        run: npm run ${{ matrix.sidecar_script }}

      - name: Tauri build (MSI + NSIS, signed for updater)
        env:
          # Updater signature (Tauri auto-imzalar `.sig` üretir, env yoksa imzalanmaz)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.rust_target }}

      - name: List artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/${{ matrix.rust_target }}/release/bundle/ |
            Where-Object { $_.Extension -in '.msi', '.exe', '.sig' } |
            ForEach-Object { "$($_.FullName) ($([math]::Round($_.Length/1KB, 2)) KB)" }

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe.sig
          generate_release_notes: true
          fail_on_unmatched_files: false

  publish-updater:
    name: Publish updater manifest (latest.json)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Generate latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p out
          cd out

          # Sürümü tag'den çıkar (refs/tags/v0.9.2 → 0.9.2)
          VERSION="${TAG#v}"
          echo "Release version: $VERSION"

          # Release asset listesini al; her .sig dosyasını indir, içeriğini oku
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > assets.txt
          echo "Assets in release:"
          cat assets.txt

          # x64 ve arm64 NSIS .sig dosyalarını bul (NSIS = .exe installer)
          # Pattern: D-Terminal_<version>_x64-setup.exe.sig veya benzeri
          X64_SIG=$(grep -E '_(x64|x86_64)[-_]setup\.exe\.sig$' assets.txt | head -1 || true)
          ARM_SIG=$(grep -E '_(arm64|aarch64)[-_]setup\.exe\.sig$' assets.txt | head -1 || true)
          X64_EXE="${X64_SIG%.sig}"
          ARM_EXE="${ARM_SIG%.sig}"

          if [ -z "$X64_SIG" ] && [ -z "$ARM_SIG" ]; then
            echo "::error::No .sig assets found in release. Updater publish skipped."
            exit 1
          fi

          BASE="https://github.com/$REPO/releases/download/$TAG"
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # JSON inşası — her platform var olduğunda eklenir
          PLATFORMS="{}"
          if [ -n "$X64_SIG" ]; then
            gh release download "$TAG" --repo "$REPO" --pattern "$X64_SIG" --dir .
            X64_SIG_CONTENT=$(cat "$X64_SIG" | tr -d '\n' | sed 's/"/\\"/g')
            PLATFORMS=$(jq -n --arg sig "$X64_SIG_CONTENT" --arg url "$BASE/$X64_EXE" \
              '{"windows-x86_64": {"signature": $sig, "url": $url}}')
          fi
          if [ -n "$ARM_SIG" ]; then
            gh release download "$TAG" --repo "$REPO" --pattern "$ARM_SIG" --dir .
            ARM_SIG_CONTENT=$(cat "$ARM_SIG" | tr -d '\n' | sed 's/"/\\"/g')
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$ARM_SIG_CONTENT" --arg url "$BASE/$ARM_EXE" \
              '. + {"windows-aarch64": {"signature": $sig, "url": $url}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pubdate "$PUBDATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: "See release notes on GitHub.", pub_date: $pubdate, platforms: $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/latest.json
          fail_on_unmatched_files: true
