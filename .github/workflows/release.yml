name: Release

on:
  push:
    tags:
      - 'v*'

# softprops/action-gh-release release oluşturmak/upload yapmak için
# GITHUB_TOKEN'in `contents: write` iznine ihtiyaç duyar (yeni org/repo
# default'u read-only).
permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.arch_label }})
    runs-on: windows-latest
    # x64 + ARM64'ü ikisini birden CI'da derler. Updater imzaları içerik-tabanlı
    # olduğundan SHA-256 nondeterminism updater yolunu etkilemez. Maintainer
    # dilerse SHA-256 dokümanı için lokal x64 binary'sini release'e elle
    # yükleyip CI çıktısını ezdirebilir.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            arch_label: arm64
            rust_target: aarch64-pc-windows-msvc
            sidecar_script: bundle:arm64
          - arch: x86_64
            arch_label: x64
            rust_target: x86_64-pc-windows-msvc
            sidecar_script: bundle:x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sidecar install (with dev deps for pkg)
        working-directory: sidecar
        run: npm install

      - name: Sidecar bundle (pkg standalone exe)
        working-directory: sidecar
        run: npm run ${{ matrix.sidecar_script }}

      - name: Tauri build (MSI + NSIS, signed for updater)
        env:
          # Updater signature (Tauri auto-imzalar `.sig` üretir, env yoksa imzalanmaz)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.rust_target }}

      - name: List artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/${{ matrix.rust_target }}/release/bundle/ |
            Where-Object { $_.Extension -in '.msi', '.exe', '.sig' } |
            ForEach-Object { "$($_.FullName) ($([math]::Round($_.Length/1KB, 2)) KB)" }

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe.sig
          generate_release_notes: true
          fail_on_unmatched_files: false

  publish-updater:
    name: Publish updater manifest (latest.json)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Generate latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p out
          cd out

          # Sürümü tag'den çıkar (refs/tags/v0.9.2 → 0.9.2)
          VERSION="${TAG#v}"
          echo "Release version: $VERSION"

          # Release asset listesini al; her .sig dosyasını indir, içeriğini oku
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > assets.txt
          echo "Assets in release:"
          cat assets.txt

          # x64 ve arm64 NSIS .sig dosyalarını bul (NSIS = .exe installer)
          # Pattern: D-Terminal_<version>_x64-setup.exe.sig veya benzeri
          X64_SIG=$(grep -E '_(x64|x86_64)[-_]setup\.exe\.sig$' assets.txt | head -1 || true)
          ARM_SIG=$(grep -E '_(arm64|aarch64)[-_]setup\.exe\.sig$' assets.txt | head -1 || true)
          X64_EXE="${X64_SIG%.sig}"
          ARM_EXE="${ARM_SIG%.sig}"

          if [ -z "$X64_SIG" ] && [ -z "$ARM_SIG" ]; then
            echo "::error::No .sig assets found in release. Updater publish skipped."
            exit 1
          fi

          BASE="https://github.com/$REPO/releases/download/$TAG"
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # JSON inşası — her platform var olduğunda eklenir
          PLATFORMS="{}"
          if [ -n "$X64_SIG" ]; then
            gh release download "$TAG" --repo "$REPO" --pattern "$X64_SIG" --dir .
            X64_SIG_CONTENT=$(cat "$X64_SIG" | tr -d '\n' | sed 's/"/\\"/g')
            PLATFORMS=$(jq -n --arg sig "$X64_SIG_CONTENT" --arg url "$BASE/$X64_EXE" \
              '{"windows-x86_64": {"signature": $sig, "url": $url}}')
          fi
          if [ -n "$ARM_SIG" ]; then
            gh release download "$TAG" --repo "$REPO" --pattern "$ARM_SIG" --dir .
            ARM_SIG_CONTENT=$(cat "$ARM_SIG" | tr -d '\n' | sed 's/"/\\"/g')
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$ARM_SIG_CONTENT" --arg url "$BASE/$ARM_EXE" \
              '. + {"windows-aarch64": {"signature": $sig, "url": $url}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pubdate "$PUBDATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: "See release notes on GitHub.", pub_date: $pubdate, platforms: $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/latest.json
          fail_on_unmatched_files: true

  security-scan:
    name: Security Scan (SHA-256 + VirusTotal + Hybrid Analysis)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p artifacts
          cd artifacts
          gh release download "$TAG" --repo "$REPO" --pattern "*.msi" --pattern "*-setup.exe"
          ls -lh

      - name: Compute SHA-256 + write to job summary
        run: |
          set -e
          cd artifacts
          echo "## 🔐 SHA-256 Hashes (v${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dosya / File | Boyut / Size | SHA-256 | VT | HA |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for file in *.msi *-setup.exe; do
            [ -e "$file" ] || continue
            hash=$(sha256sum "$file" | awk '{print $1}')
            size=$(du -h "$file" | awk '{print $1}')
            vt_url="https://www.virustotal.com/gui/file/$hash"
            ha_url="https://www.hybrid-analysis.com/sample/$hash"
            echo "| \`$file\` | $size | \`$hash\` | [VT]($vt_url) | [HA]($ha_url) |" >> "$GITHUB_STEP_SUMMARY"
            echo "$file -> $hash" | tee -a hashes.txt
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> README badge'lerini güncellemek için yukarıdaki SHA-256'ları kullan." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hashes.txt to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/hashes.txt
          fail_on_unmatched_files: false

      - name: Submit to VirusTotal + Hybrid Analysis (rate-limited, 20s/dosya)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
        run: |
          set +e  # Tek bir dosya hatası butun islemi durdurmasin
          cd artifacts

          if [ -z "$VT_API_KEY" ] && [ -z "$HA_API_KEY" ]; then
            echo "::notice::VT_API_KEY ve HA_API_KEY tanımlı değil. Submission atlandı (sadece SHA-256 hesaplandı)."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ VT_API_KEY / HA_API_KEY GitHub Secrets'ta yok — manuel yükleme gerekli." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🛡 Submission Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dosya / File | VirusTotal | Hybrid Analysis |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for file in *.msi *-setup.exe; do
            [ -e "$file" ] || continue
            echo "----------------------------------------"
            echo "Processing: $file"

            vt_status="—"
            ha_status="—"

            # VirusTotal — file API
            if [ -n "$VT_API_KEY" ]; then
              echo "[VT] Submitting $file..."
              http_code=$(curl -s -o /tmp/vt_response.json -w "%{http_code}" -X POST \
                "https://www.virustotal.com/api/v3/files" \
                -H "x-apikey: $VT_API_KEY" \
                -F "file=@$file")
              if [ "$http_code" = "200" ]; then
                vt_status="✅ submitted"
              else
                vt_status="⚠️ HTTP $http_code"
                echo "[VT] Error: HTTP $http_code"
                cat /tmp/vt_response.json
              fi
            else
              vt_status="🔇 no API key"
            fi

            # Hybrid Analysis — Falcon Sandbox, environment 140 = Windows 10 64-bit
            if [ -n "$HA_API_KEY" ]; then
              echo "[HA] Submitting $file..."
              http_code=$(curl -s -o /tmp/ha_response.json -w "%{http_code}" -X POST \
                "https://www.hybrid-analysis.com/api/v2/submit/file" \
                -H "accept: application/json" \
                -H "api-key: $HA_API_KEY" \
                -H "User-Agent: Falcon Sandbox" \
                -F "file=@$file" \
                -F "environment_id=140")
              if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                ha_status="✅ submitted"
              else
                ha_status="⚠️ HTTP $http_code"
                echo "[HA] Error: HTTP $http_code"
                cat /tmp/ha_response.json
              fi
            else
              ha_status="🔇 no API key"
            fi

            echo "| \`$file\` | $vt_status | $ha_status |" >> "$GITHUB_STEP_SUMMARY"

            # Rate limit: VT free 4/dk, 20s sleep = 3/dk (güvende)
            echo "Waiting 20s for rate limit..."
            sleep 20
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ⏳ Tarama sonuçları VT ve HA'da analiz edildikten sonra (~1-3 dk) yukarıdaki SHA-256 linkleri çalışır." >> "$GITHUB_STEP_SUMMARY"
