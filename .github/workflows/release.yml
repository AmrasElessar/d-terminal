name: Release

on:
  push:
    tags:
      - 'v*'

# Varsayılan olarak salt-okunur token. Yazma izni yalnızca publish ve
# security-scan job'larında, job seviyesinde verilir.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Güvenlik modeli (supply-chain hardening):
#   1. verify  — tag commit'i main üzerinde mi ve o commit için CI yeşil mi?
#   2. build   — imza anahtarı OLMADAN derler. pnpm/npm lifecycle script'leri,
#                vite plugin'leri ve crate build.rs'leri bu job'da çalışır;
#                bu yüzden burada hiçbir secret ve yazma yetkili token yok.
#   3. publish — korumalı `release` Environment'ında çalışır. Yalnızca build
#                artifact'larını indirir, `tauri signer sign` ile minisign
#                imzalarını üretir, latest.json'u oluşturur ve TEK bir job'dan
#                GitHub Release'i yaratır (matrix yarışı yok). Bu job proje
#                bağımlılıklarını kurmaz/çalıştırmaz.
#   4. security-scan — yayınlanan installer'ların SHA-256 + VT/HA taraması.

jobs:
  verify:
    name: Verify tag (on main + CI green)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag commit must be reachable from main
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tag commit $SHA is not on main — refusing to release."
            exit 1
          fi
          echo "OK: $SHA is on main"

      - name: Wait for CI success on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # CI (ci.yml) main'e push'ta çalışır. En fazla ~45 dk bekle.
          for i in $(seq 1 90); do
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            success=$(echo "$runs" | jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
            pending=$(echo "$runs" | jq '[.[] | select(.status!="completed")] | length')
            failed=$(echo "$runs" | jq '[.[] | select(.status=="completed" and .conclusion!="success")] | length')
            if [ "$success" -gt 0 ]; then
              echo "OK: CI succeeded for $SHA"
              exit 0
            fi
            if [ "$pending" -eq 0 ] && [ "$failed" -gt 0 ]; then
              echo "::error::CI failed for $SHA — refusing to release."
              exit 1
            fi
            echo "Waiting for CI on $SHA (attempt $i, pending=$pending)…"
            sleep 30
          done
          echo "::error::Timed out waiting for a successful CI run on $SHA."
          exit 1

  build:
    name: Build (${{ matrix.arch_label }})
    needs: [verify]
    runs-on: windows-latest
    permissions:
      contents: read
    # x64 + ARM64'ü ikisini birden CI'da derler. Updater imzaları içerik-tabanlı
    # olduğundan SHA-256 nondeterminism updater yolunu etkilemez.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            arch_label: arm64
            rust_target: aarch64-pc-windows-msvc
            sidecar_script: bundle:arm64
          - arch: x86_64
            arch_label: x64
            rust_target: x86_64-pc-windows-msvc
            sidecar_script: bundle:x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # package.json `packageManager: pnpm@9.15.0` ile EŞİT pin —
          # action-setup v6 packageManager auto-detect yapmıyor; version'suz
          # bırakılırsa latest pnpm 10.x kurulur ve Node 20 ile node:sqlite
          # ERR_UNKNOWN_BUILTIN_MODULE hatası verir.
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sidecar install (lockfile-exact, with dev deps for pkg)
        working-directory: sidecar
        run: npm ci

      - name: Sidecar bundle (pkg standalone exe)
        working-directory: sidecar
        run: npm run ${{ matrix.sidecar_script }}

      # İmza anahtarı bu job'a VERİLMEZ. Updater artifact üretimi kapatılır;
      # .sig dosyaları publish job'unda `tauri signer sign` ile üretilir
      # (Tauri v2'de updater artifact'ı installer'ın kendisidir, imza da
      # installer dosyasının minisign imzasıdır — çıktı birebir aynı).
      - name: Tauri build (MSI + NSIS, unsigned)
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater-sign.json"
          pnpm tauri build --target "$RUST_TARGET" --config "$RUNNER_TEMP/no-updater-sign.json"

      - name: Verify bundle outputs (MSI + NSIS .exe)
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $bundleRoot = "src-tauri/target/$env:RUST_TARGET/release/bundle"
          $msi = Get-ChildItem -Recurse "$bundleRoot/msi" -Filter '*.msi' -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem -Recurse "$bundleRoot/nsis" -Filter '*-setup.exe' -ErrorAction SilentlyContinue
          if (-not $msi -or -not $nsis) {
            Write-Error "FAIL: bundle output eksik — MSI + NSIS (.exe) gerekli"
            exit 1
          }
          (@($msi) + @($nsis)) | ForEach-Object { "$($_.FullName) ($([math]::Round($_.Length/1KB, 2)) KB)" }
          # Düz bir staging klasörüne topla — publish job'u tek dizinden okur.
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          (@($msi) + @($nsis)) | Copy-Item -Destination staging/

      - name: Upload unsigned installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.arch_label }}
          path: staging/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign + publish release
    needs: [build]
    runs-on: ubuntu-latest
    # Korumalı environment: TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) yalnızca bu
    # environment'ın secret'larıdır; required reviewers onayı olmadan job
    # başlamaz.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: dist-release
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      # Yalnızca Tauri CLI kurulur (lockfile'daki sürüm, lifecycle script'leri
      # kapalı). Proje bağımlılıkları bu job'da kurulmaz/çalıştırılmaz.
      - name: Install Tauri CLI (signer only)
        run: |
          set -euo pipefail
          CLI_VERSION=$(grep -oE "^  '@tauri-apps/cli@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Tauri CLI $CLI_VERSION"
          mkdir -p "$RUNNER_TEMP/signer"
          npm install --prefix "$RUNNER_TEMP/signer" --no-save --ignore-scripts --no-audit --no-fund "@tauri-apps/cli@$CLI_VERSION"
          echo "$RUNNER_TEMP/signer/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Sign installers (minisign .sig)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd dist-release
          ls -l
          shopt -s nullglob
          files=( *.msi *-setup.exe )
          if [ "${#files[@]}" -lt 4 ]; then
            echo "::error::Beklenen 4 installer (2 arch × MSI+NSIS), bulunan: ${#files[@]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            # Şifre açıkça verilir: anahtar şifresizse secret tanımlı değildir ve
            # clap boş env değerini "yok" sayar → CLI TTY'siz ortamda şifre sorar.
            tauri signer sign --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$f"
            test -s "$f.sig" || { echo "::error::$f.sig üretilmedi"; exit 1; }
          done
          ls -l

      - name: Generate latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist-release
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          X64_EXE=$(ls | grep -E '_(x64|x86_64)[-_]setup\.exe$' | head -1 || true)
          ARM_EXE=$(ls | grep -E '_(arm64|aarch64)[-_]setup\.exe$' | head -1 || true)
          if [ -z "$X64_EXE" ] && [ -z "$ARM_EXE" ]; then
            echo "::error::NSIS installer bulunamadı; latest.json üretilemedi."
            exit 1
          fi

          PLATFORMS="{}"
          if [ -n "$X64_EXE" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --rawfile sig "$X64_EXE.sig" --arg url "$BASE/$X64_EXE" \
              '. + {"windows-x86_64": {"signature": ($sig | rtrimstr("\n")), "url": $url}}')
          fi
          if [ -n "$ARM_EXE" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --rawfile sig "$ARM_EXE.sig" --arg url "$BASE/$ARM_EXE" \
              '. + {"windows-aarch64": {"signature": ($sig | rtrimstr("\n")), "url": $url}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pubdate "$PUBDATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: "See release notes on GitHub.", pub_date: $pubdate, platforms: $platforms}' \
            > latest.json
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist-release/*.msi
            dist-release/*.msi.sig
            dist-release/*-setup.exe
            dist-release/*-setup.exe.sig
            dist-release/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: true

  security-scan:
    name: Security Scan (SHA-256 + VirusTotal + Hybrid Analysis)
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p artifacts
          cd artifacts
          gh release download "$TAG" --repo "$REPO" --pattern "*.msi" --pattern "*-setup.exe"
          ls -lh

      - name: Compute SHA-256 + write to job summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          cd artifacts
          echo "## 🔐 SHA-256 Hashes ($TAG)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dosya / File | Boyut / Size | SHA-256 | VT | HA |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for file in *.msi *-setup.exe; do
            [ -e "$file" ] || continue
            hash=$(sha256sum "$file" | awk '{print $1}')
            size=$(du -h "$file" | awk '{print $1}')
            vt_url="https://www.virustotal.com/gui/file/$hash"
            ha_url="https://www.hybrid-analysis.com/sample/$hash"
            echo "| \`$file\` | $size | \`$hash\` | [VT]($vt_url) | [HA]($ha_url) |" >> "$GITHUB_STEP_SUMMARY"
            echo "$file -> $hash" | tee -a hashes.txt
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> README badge'lerini güncellemek için yukarıdaki SHA-256'ları kullan." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hashes.txt to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/hashes.txt
          fail_on_unmatched_files: false

      - name: Submit to VirusTotal + Hybrid Analysis (rate-limited, 20s/dosya)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
        run: |
          set +e  # Tek bir dosya hatası butun islemi durdurmasin
          cd artifacts

          if [ -z "$VT_API_KEY" ] && [ -z "$HA_API_KEY" ]; then
            echo "::notice::VT_API_KEY ve HA_API_KEY tanımlı değil. Submission atlandı (sadece SHA-256 hesaplandı)."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ VT_API_KEY / HA_API_KEY GitHub Secrets'ta yok — manuel yükleme gerekli." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🛡 Submission Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dosya / File | VirusTotal | Hybrid Analysis |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for file in *.msi *-setup.exe; do
            [ -e "$file" ] || continue
            echo "----------------------------------------"
            echo "Processing: $file"

            vt_status="—"
            ha_status="—"

            # VirusTotal — file API
            if [ -n "$VT_API_KEY" ]; then
              echo "[VT] Submitting $file..."
              http_code=$(curl -s -o /tmp/vt_response.json -w "%{http_code}" -X POST \
                "https://www.virustotal.com/api/v3/files" \
                -H "x-apikey: $VT_API_KEY" \
                -F "file=@$file")
              if [ "$http_code" = "200" ]; then
                vt_status="✅ submitted"
              else
                vt_status="⚠️ HTTP $http_code"
                echo "[VT] Error: HTTP $http_code"
                cat /tmp/vt_response.json
              fi
            else
              vt_status="🔇 no API key"
            fi

            # Hybrid Analysis — Falcon Sandbox, environment 140 = Windows 10 64-bit
            if [ -n "$HA_API_KEY" ]; then
              echo "[HA] Submitting $file..."
              http_code=$(curl -s -o /tmp/ha_response.json -w "%{http_code}" -X POST \
                "https://www.hybrid-analysis.com/api/v2/submit/file" \
                -H "accept: application/json" \
                -H "api-key: $HA_API_KEY" \
                -H "User-Agent: Falcon Sandbox" \
                -F "file=@$file" \
                -F "environment_id=140")
              if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                ha_status="✅ submitted"
              else
                ha_status="⚠️ HTTP $http_code"
                echo "[HA] Error: HTTP $http_code"
                cat /tmp/ha_response.json
              fi
            else
              ha_status="🔇 no API key"
            fi

            echo "| \`$file\` | $vt_status | $ha_status |" >> "$GITHUB_STEP_SUMMARY"

            # Rate limit: VT free 4/dk, 20s sleep = 3/dk (güvende)
            echo "Waiting 20s for rate limit..."
            sleep 20
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ⏳ Tarama sonuçları VT ve HA'da analiz edildikten sonra (~1-3 dk) yukarıdaki SHA-256 linkleri çalışır." >> "$GITHUB_STEP_SUMMARY"
