name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release (${{ matrix.arch_label }})
    runs-on: windows-latest
    # NOT: x64 build maintainer tarafından manuel olarak release'e upload
    # ediliyor (RELEASE_NOTES.md'deki SHA-256'lar yerel build'den hesaplandı,
    # CI'da rebuild olunca timestamp/nondeterminism nedeniyle hash değişir).
    # CI yalnız ARM64'ü cross-compile eder — yerel makinede LLVM/MSVC-ARM64
    # toolchain olmadığından bu CI'a kalır.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            arch_label: arm64
            rust_target: aarch64-pc-windows-msvc
            sidecar_script: bundle:arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sidecar install (with dev deps for pkg)
        working-directory: sidecar
        run: npm install

      - name: Sidecar bundle (pkg standalone exe)
        working-directory: sidecar
        run: npm run ${{ matrix.sidecar_script }}

      - name: Tauri build (MSI + NSIS)
        run: pnpm tauri build --target ${{ matrix.rust_target }}

      - name: List artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/${{ matrix.rust_target }}/release/bundle/ |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            ForEach-Object { "$($_.FullName) ($([math]::Round($_.Length/1MB, 2)) MB)" }

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
