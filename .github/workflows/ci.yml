name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (Vue/TS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec vue-tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust core (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri build script frontendDist klasörünü ve externalBin path'lerini
      # doğrular; clippy/test için gerçek build'e gerek yok, dosya mevcut olmalı.
      - name: Stub frontend dist + sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><html><head><meta charset="utf-8"><title>D-Terminal CI stub</title></head><body></body></html>'
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          # externalBin path doğrulaması için boş dosya yeterli (clippy/test
          # binary'i çalıştırmaz, yalnız Tauri build script existence check yapar).
          New-Item -ItemType File -Force -Path src-tauri/binaries/dterminal-pty-bridge-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  sidecar:
    name: Sidecar (Node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: sidecar
        run: npm install

      - name: Test
        working-directory: sidecar
        run: npm test
