name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# En az yetki: CI yalnızca kodu okur.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Vue/TS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # packageManager (package.json) ile EŞİT pin — action-setup v6
          # packageManager'ı default okumuyor; version'suz bırakılırsa latest
          # pnpm 10.x kurulur ve Node 20 ile node:sqlite hatası verir.
          # Eşit (9.15.0 == pnpm@9.15.0) olduğu sürece "Multiple versions"
          # hatası tetiklenmez.
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec vue-tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust core (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Tauri build script frontendDist klasörünü ve externalBin path'lerini
      # doğrular; clippy/test için gerçek build'e gerek yok, dosya mevcut olmalı.
      - name: Stub frontend dist + sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><html><head><meta charset="utf-8"><title>D-Terminal CI stub</title></head><body></body></html>'
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          # Her iki target için sidecar stub bırak — Tauri externalBin
          # existence check'i her arch için ayrı dosya bekler.
          New-Item -ItemType File -Force -Path src-tauri/binaries/dterminal-pty-bridge-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/binaries/dterminal-pty-bridge-aarch64-pc-windows-msvc.exe | Out-Null

      - name: Format check
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

      # Windows uçtan uca testleri (gerçek sidecar + node-pty + ConPTY ile
      # cmd/PowerShell, büyük çıktı, kapanışta süreç davranışı) için sidecar
      # bağımlılıkları gerekir.
      - name: Setup Node (e2e)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: Install sidecar deps (e2e)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: sidecar
        run: npm ci

      # Test yalnızca x64'te — ARM64 cross-compile testleri Windows runner'da
      # çalıştırılamaz (binary native ARM64'te koşar, x64 host'ta exec'lenmez).
      - name: Test
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: src-tauri
        env:
          # node-pty yüklenemezse e2e testleri atlanmasın, başarısız olsun.
          DTERM_REQUIRE_E2E: '1'
        run: cargo test -- --nocapture

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # RustSec advisory veritabanına karşı Cargo.lock'taki tüm crate'leri
      # tara. CI'da ayrı bir job — fail olsa diğer job'ları engellemesin.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  sidecar:
    name: Sidecar (Node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: Install (lockfile-exact)
        working-directory: sidecar
        run: npm ci

      - name: Test
        working-directory: sidecar
        run: npm test

      # Release'te kullanılan pkg paketlemesini PR'da da dene: pkg/pkg-fetch
      # güncellemesi hazır Node binary'si bulamazsa release anında değil
      # burada kırılsın.
      - name: Bundle smoke test (pkg, x64)
        working-directory: sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../src-tauri/binaries | Out-Null
          npm run bundle:x64
          if (-not (Test-Path ../src-tauri/binaries/dterminal-pty-bridge-x86_64-pc-windows-msvc.exe)) { throw "pkg output missing" }
