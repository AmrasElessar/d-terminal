name: Cache Cleanup

# Haftalık LRU cache sweep — Pazar 02:00 UTC. GitHub Actions cache repo
# başına 10 GB soft limit (LRU eviction otomatik) ama Swatinem/rust-cache
# x64+ARM64+CI+Release kombinasyonu pratikte 12+ GB tutuyor; eski cache'ler
# stale dependency'lerle kalsa workflow'lar gereksiz cache miss yaşar.
#
# Strateji: 7 günden eski tüm cache'leri sil. workflow_dispatch ile manuel
# trigger da var.

on:
  schedule:
    - cron: '0 2 * * 0'  # Pazar 02:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches older than 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
            const cutoff = Date.now() - sevenDaysMs;
            let page = 1;
            let deleted = 0;
            let kept = 0;
            while (true) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              if (!data.actions_caches.length) break;
              for (const cache of data.actions_caches) {
                const lastAccess = new Date(cache.last_accessed_at).getTime();
                if (lastAccess < cutoff) {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                  deleted++;
                  console.log(`Deleted: ${cache.key} (${(cache.size_in_bytes / 1024 / 1024).toFixed(1)} MB, last accessed ${cache.last_accessed_at})`);
                } else {
                  kept++;
                }
              }
              page++;
            }
            core.summary
              .addHeading('🧹 Cache Cleanup Results')
              .addRaw(`- **Deleted:** ${deleted} cache(s) older than 7 days\n`)
              .addRaw(`- **Kept:** ${kept} cache(s) still active\n`)
              .write();
            console.log(`Done: ${deleted} deleted, ${kept} kept`);
