[package]
name = "d-terminal"
version = "0.11.0"
description = "D-Terminal — Agent-aware Windows Terminal"
authors = ["Orhan Engin OKAY"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AmrasElessar/d-terminal"
edition = "2021"
rust-version = "1.77"

[lib]
name = "d_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# DevTools sadece debug build'lerde — release'de WebView2 inspector kapalı
# (XSS post-compromise inceleme/manipülasyon yüzeyini kapatır).
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Auto-start: Windows'ta HKCU\Software\Microsoft\Windows\CurrentVersion\Run
# registry'sine D-Terminal entry'si ekler/siler. macOS LaunchAgent, Linux
# autostart .desktop. Tauri 2 resmi plugin.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# Config as Code: kullanıcı ayarları TOML dosyasına export/import edilebilir.
# Hot-reload v1.0.5'te eklenecek (notify crate zaten dependency listesinde).
toml = "0.8"

# Storage (ADR-0003)
rusqlite = { version = "0.31", features = ["bundled", "chrono", "blob"] }
refinery = { version = "0.8", features = ["rusqlite"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Secret storage (ADR-0002)
zeroize = { version = "1.8", features = ["derive"] }

# System info (DFetch)
sysinfo = "0.30"
sys-locale = "0.3"
# DFetch: yerel IP listesi (network interface tarama). Yalnızca yerel ağ —
# public IP fetch ETMİYORUZ (KVKK/GDPR offline-first prensibi).
local-ip-address = "0.6"
# Aktif interface'in MAC adresini almak için (Windows: GetAdaptersAddresses
# wrapper). MAC'ler de IP gibi yalnızca yerel — frontend'de varsayılan maskeli.
mac_address = "1.1"

# Sidecar IPC (ADR-0001)
byteorder = "1.5"
ciborium = "0.2"

# AI proxy: HTTP client (rustls — bundled native TLS yerine cross-platform)
# + SSE/NDJSON streaming. AI key Rust'ta kalır, frontend'e hiç sızmaz.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = "0.1"

# Log Stream pane — dosya değişikliklerini izle (tail -f benzeri)
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
window-vibrancy = "0.5"
# DFetch: GPU + battery (WMI, lazy — sadece dfetch çağrısında kullanılır, ADR-0009)
wmi = "0.14"
# DFetch: Windows tema tespiti (registry: AppsUseLightTheme)
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
