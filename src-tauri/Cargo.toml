[package]
name = "d-terminal"
version = "0.1.0"
description = "D-Terminal — Agent-aware Windows Terminal"
authors = ["Engin Demirel"]
license = "MIT"
repository = "https://github.com/AmrasElessar/d-terminal"
edition = "2021"
rust-version = "1.77"

[lib]
name = "d_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# Storage (ADR-0003)
rusqlite = { version = "0.31", features = ["bundled", "chrono", "blob"] }
refinery = { version = "0.8", features = ["rusqlite"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Secret storage (ADR-0002)
zeroize = { version = "1.8", features = ["derive"] }

# System info (DFetch)
sysinfo = "0.30"

# Sidecar IPC (ADR-0001)
byteorder = "1.5"
ciborium = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
